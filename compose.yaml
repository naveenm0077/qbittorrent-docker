services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    environment:
      PUID: 501
      PGID: 20
      TZ: Asia/Kolkata
      WEBUI_PORT: 8080

    volumes:
      - ./config:/config
      - ${HOME}/Downloads/qbittorrent-downloads:/downloads
      - ./plugins:/plugins

    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

    restart: unless-stopped

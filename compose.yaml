services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    environment:
      PUID: 501
      PGID: 20
      TZ: Asia/Kolkata
      WEBUI_PORT: ${QB_WEBUI_PORT:-8090}

    volumes:
      - ./config:/config
      - ${QB_DOWNLOADS:-${HOME}/Downloads/qbittorrent-downloads}:/downloads
      - ./plugins:/plugins

    ports:
      - "${QB_WEBUI_PUBLISH:-127.0.0.1:8090}:${QB_WEBUI_PORT:-8090}"
      - "6881:6881"
      - "6881:6881/udp"

    restart: unless-stopped
